[platformio]
default_envs = nano-prod
description = AcouSense firmware build matrix for Arduino Nano, ESP32, and hardware validation sketches

[env]
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/sync_shared_headers.py

[env:nano-prod]
platform = atmelavr
board = nanoatmega328
build_src_filter =
  -<*>
  +<firmware/arduino/acoustics_nano.cpp>
  +<firmware/arduino/*.cpp>
lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4 

[env:nano-test-microphone]
platform = atmelavr
board = nanoatmega328
build_src_filter =
  -<*>
  +<firmware/tests/test_microphone.cpp>

[env:nano-test-lcd]
platform = atmelavr
board = nanoatmega328
build_src_filter =
  -<*>
  +<firmware/tests/test_lcd.cpp>
lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:nano-test-buzzer]
platform = atmelavr
board = nanoatmega328
build_src_filter =
  -<*>
  +<firmware/tests/test_buzzer.cpp>

[env:esp32-prod]
platform = espressif32
board = esp32dev
build_src_filter =
  -<*>
  +<firmware/esp32/acoustics_esp32.cpp>
  +<firmware/esp32/*.cpp>
lib_deps =
  https://github.com/me-no-dev/AsyncTCP.git
  https://github.com/me-no-dev/ESPAsyncWebServer.git
  bblanchon/ArduinoJson@^7.3.1
  https://github.com/siara-cc/esp32_arduino_sqlite3_lib.git

[env:esp32-test-sdcard]
platform = espressif32
board = esp32dev
build_src_filter =
  -<*>
  +<firmware/tests/test_sdcard.cpp>
