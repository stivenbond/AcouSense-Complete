services:
  webui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_ESP_API_ORIGIN:-http://192.168.4.1}
        VITE_AUTH_BASE_URL: ${PUBLIC_AUTH_ORIGIN:-}
        VITE_USE_BACKEND: "true"
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:-}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
    ports:
      - "${WEBUI_PORT:-8080}:80"
    restart: unless-stopped
