[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acousense"
version = "2.0.0"
description = "AcouSense Urban Soundscape Intelligence Platform — Analytics Engine & API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.55.0",
    "dateparser>=1.2.0",
    "structlog>=24.1.0",
    "slowapi>=0.1.9",
    "keyring>=25.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    "pip-audit>=2.7.0"
]
docs = [
    "mkdocs-material>=9.5.0"
]

[project.scripts]
acousense = "acousense.cli.app:app"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "U"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-fail-under=80"
