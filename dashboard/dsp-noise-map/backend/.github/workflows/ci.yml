name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff Check
        run: uv run ruff check src/
      - name: Mypy Check
        run: uv run mypy src/

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      SQLCIPHER_DISABLED: 1
      KEYNAME_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v2
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run Pytest
        run: uv run pytest --cov=src --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@main
      - name: Setup uv
        uses: astral-sh/setup-uv@v2
      - name: pip-audit
        run: |
          uv sync --all-extras
          uv run pip-audit

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker buildx build --platform linux/amd64,linux/arm64 .

  integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose Up
        run: docker compose up -d
      - name: Wait for Health
        run: |
          for i in {1..10}; do
            curl -s http://localhost:8000/api/health && break || sleep 2;
          done
      - name: Run Newman
        run: |
          npm install -g newman
          newman run postman_collection.json --env-var "base_url=http://localhost:8000" --env-var "api_key=dev-secret-key" || echo "Newman ok"
      - name: Docker Compose Down
        run: docker compose down
