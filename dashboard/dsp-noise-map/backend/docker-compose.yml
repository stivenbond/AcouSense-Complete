version: '3.8'

# CAUTION: For local development only. Production uses Kubernetes.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - acousense-data:/data
    environment:
      - ACOUSENSE_DATA_DIR=/data
      - SQLCIPHER_DISABLED=1
      - ACOUSENSE_API_KEY=dev-secret-key
    restart: unless-stopped

volumes:
  acousense-data:
