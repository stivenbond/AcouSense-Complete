; AcouSense — PlatformIO project (Arduino Nano + ESP32)
;
; Always run PlatformIO from this directory, for example:
;   pio run -e nano-prod
;   pio run -e nano-prod -t upload
;
; From the repo root:
;   pio run -d firmware -e nano-prod

[platformio]
default_envs = nano-prod, esp32-prod
description = AcouSense firmware build matrix for Arduino Nano, ESP32, and hardware validation sketches
; Treat firmware/ as the source root so paths like arduino/*.cpp resolve correctly.
src_dir = .

[env]
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/sync_shared_headers.py

[env:nano-prod]
platform = atmelavr
board = nanoatmega328new
build_src_filter =
  -<*>
  +<arduino/acoustics_nano.cpp>
  +<arduino/*.cpp>
lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4

